spring.application.name=backend

# =============================================================================
# 1. HashiCorp Vault — Configuración de Spring Cloud Vault (ConfigData API)
#
# spring.config.import=vault:// le indica a Spring Boot que importe propiedades
# desde Vault al arrancar. Requiere spring-cloud-starter-vault-config en pom.xml.
# No necesita bootstrap context; funciona con la API ConfigData de Spring Boot 2.4+.
#
# Secretos que se leen desde Vault (path: secret/inventario):
#   - spring.datasource.password  → inyectado automáticamente por Spring
#   - app.security.secret-key     → inyectado automáticamente por Spring
#   - jwt.secret-key              → inyectado en JwtService via @Value
#
# VAULT_TOKEN se pasa como variable de entorno desde .env.docker.
# En producción reemplazar token auth por AppRole o Kubernetes auth method.
# =============================================================================
spring.config.import=vault://
spring.cloud.vault.token=${VAULT_TOKEN}
spring.cloud.vault.host=vault
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.kv-version=2
spring.cloud.vault.kv.default-context=inventario
# Timeout de conexión a Vault en segundos
spring.cloud.vault.connection-timeout=5000
spring.cloud.vault.read-timeout=15000

# =============================================================================
# 2. Configuración de la Fuente de Datos (DataSource)
#
# La URL y el usuario vienen de variables de entorno (no son secretos críticos).
# El password (spring.datasource.password) es inyectado automáticamente por
# Spring Cloud Vault desde el path secret/inventario en Vault.
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =============================================================================
# 3. Configuración de JPA / Hibernate
#
# 'update' es apropiado para desarrollo. No borra datos, solo actualiza el
# esquema si las entidades cambian. Para producción usar 'validate' con Flyway.
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# 4. Seguridad — Clave AES para EncryptionService
#
# app.security.secret-key es inyectado automáticamente por Spring Cloud Vault
# desde secret/inventario. NO se referencia aquí como ${APP_SECURITY_SECRET_KEY}
# porque ahora Vault es la fuente de verdad. Si Vault no está disponible al
# arrancar, Spring Boot fallará con un error de configuración explícito.
# =============================================================================

# =============================================================================
# 5. Logging
#
# NOTA: logging.level.org.hibernate.SQL=DEBUG es solo para desarrollo.
# Desactivar en producción para evitar data leakage y overhead de I/O.
# =============================================================================
logging.level.root=INFO
logging.level.com.proveedorio.backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.vault=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=/app/logs/backend.log

# =============================================================================
# 6. Actuator y Métricas
# =============================================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true