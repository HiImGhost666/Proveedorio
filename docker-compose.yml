services:
  # --- LOG RESET (truncate logs on each compose up) ---
  log-reset:
    image: alpine:3.20
    container_name: inventario-log-reset
    restart: "no"
    command: >
      sh -c "mkdir -p /logs/backend /logs/frontend
      && : > /logs/backend/backend.log
      && : > /logs/frontend/access.log
      && : > /logs/frontend/error.log"
    volumes:
      - ./logs:/logs

  # --- MARIADB LOCAL ---
  mariadb-local:
    image: mariadb:10.11
    container_name: inventario-db-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventariodb
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SECRET MANAGEMENT (VAULT) ---
  vault:
    image: hashicorp/vault:1.17
    container_name: inventario-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- VAULT INIT (SEEDS secret/inventario) ---
  vault-init:
    image: hashicorp/vault:1.17
    container_name: inventario-vault-init
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_SECURITY_SECRET_KEY: ${APP_SECURITY_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      - ./infra/vault/init:/vault/init:ro
    entrypoint: ["sh", "-c", "sh /vault/init/init-vault.sh"]
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - inventario-net

  # --- SUPPLIER MOCK SERVER ---
  json-mock-server:
    build:
      context: ./infra/json-mock-server
    container_name: json-mock-server
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/products"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- BACKEND (SPRING BOOT) ---
  backend:
    # Local development (build from local repository):
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Registry image (use this in server/prod):
    # image: ${BACKEND_IMAGE}:${BACKEND_TAG}
    container_name: inventario-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      log-reset:
        condition: service_completed_successfully
      json-mock-server:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      mariadb-local:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./logs/backend:/app/logs
    networks:
      - inventario-net

  # --- FRONTEND (NGINX STATIC) ---
  frontend:
    # Local development (build from local repository):
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Registry image (use this in server/prod):
    # image: ${FRONTEND_IMAGE}:${FRONTEND_TAG}
    container_name: inventario-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./logs/frontend:/usr/share/nginx/logs
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - inventario-net

  # --- OBSERVABILITY ---
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: inventario-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    networks:
      - inventario-net

  alloy:
    # Tip: if Docker Hub is slow/blocked, use GHCR:
    # ALLOY_IMAGE=ghcr.io/grafana/alloy:latest
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    container_name: inventario-alloy
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/tmp/alloy /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      prometheus:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - inventario-net

  grafana:
    image: grafana/grafana:11.1.4
    container_name: inventario-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - inventario-net

networks:
  inventario-net:
    driver: bridge

volumes:
  mariadb_data:
  grafana_data:
